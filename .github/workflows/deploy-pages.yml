name: Deploy to GitHub Pages

on:
  push:
    branches:
      - claude/landing-page-scroll-animations-1sepuq
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          # cria o site do Pages na primeira execução, sem precisar mexer em Settings
          enablement: true

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          # site estático puro — a raiz do repo é o site
          path: .

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
